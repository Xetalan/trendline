<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2a78d6" />
  <title>Trendline · Oura</title>
  <style>
    :root {
      color-scheme: light;
      --plane: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b;
      --muted: #52514e; --line: rgba(11,11,11,.12); --accent: #2a78d6;
      --accent-ink: #fff; --bad: #b02a2a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --plane: #0d0d0d; --surface: #1a1a19; --ink: #fff;
        --muted: #c3c2b7; --line: rgba(255,255,255,.14); --accent: #3987e5;
        --accent-ink: #0d0d0d; --bad: #e66767;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center; padding: 22px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--plane); color: var(--ink);
    }
    .card {
      width: 100%; max-width: 460px;
      background: var(--surface);
      border: 1px solid var(--line); border-radius: 14px;
      padding: 24px 22px 26px;
    }
    .mark { width: 34px; height: 34px; display: block; margin-bottom: 14px; }
    h1 { font-size: 19px; font-weight: 650; letter-spacing: -.015em; margin: 0 0 6px; }
    p { margin: 0 0 16px; font-size: 14px; line-height: 1.55; color: var(--muted); }
    .code {
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 15px; word-break: break-all; user-select: all;
      background: var(--plane); border: 1px solid var(--line);
      border-radius: 10px; padding: 14px; margin-bottom: 12px;
    }
    button {
      width: 100%; font: inherit; font-weight: 600; font-size: 15px;
      padding: 12px; border: 0; border-radius: 10px;
      background: var(--accent); color: var(--accent-ink); cursor: pointer;
    }
    button:active { transform: translateY(.5px); }
    .step { font-size: 13px; color: var(--muted); margin-top: 16px; }
    .err { color: var(--bad); font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="1" y="1" width="22" height="22" rx="6" fill="var(--accent)"/>
      <path d="M5 16.5 L9.5 11.5 L13 14 L19 6.5" stroke="var(--accent-ink)"
            stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1 id="title">Connecting Oura…</h1>
    <p id="msg">One moment.</p>
    <div id="body"></div>
  </div>

  <script src="oauth.js"></script>
</body>
</html>
